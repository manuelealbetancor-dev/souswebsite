<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><meta name="theme-color" content="#f8f8f6"><title>Receta · Chefo</title><link rel="stylesheet" href="style.css?v=2"></head>
<body><main>
<nav aria-label="Receta compartida"><a class="brand" href="/" aria-label="Chefo, inicio"><img src="assets/mascot.png" alt="" width="34" height="34">Chefo</a><button class="icon-button" id="print" aria-label="Imprimir receta" type="button">↥</button></nav>
<p id="status" role="status">Abriendo receta…</p>

<div class="dish" aria-hidden="true"><div class="dish-card"><img src="assets/mascot.png" alt=""><span id="dish-emoji">🍽️</span></div><i></i><i></i></div>
